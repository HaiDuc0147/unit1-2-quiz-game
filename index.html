<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>

  <!-- ===== Setup ===== -->
  <section id="setup" class="screen active">
    <div class="setup-card">
      <div class="logo">Quiz<span>Quest</span></div>
      <p class="subtitle" id="quizSubtitle"></p>

      <div class="teams-setup">
        <div class="team-setup t0">
          <label for="name0">Team 1</label>
          <input id="name0" maxlength="16" autocomplete="off">
          <div class="avatars" data-team="0"></div>
        </div>
        <div class="vs">VS</div>
        <div class="team-setup t1">
          <label for="name1">Team 2</label>
          <input id="name1" maxlength="16" autocomplete="off">
          <div class="avatars" data-team="1"></div>
        </div>
      </div>

      <div class="opt-row"><h3>How many cards?</h3><div class="chips" id="sizeChips"></div></div>
      <div class="opt-row"><h3>Surprise cards</h3><div class="chips" id="spChips"></div></div>
      <div class="opt-row"><h3>Points</h3><div class="chips" id="ptChips"></div></div>
      <div class="opt-row"><h3>Timer</h3><div class="chips" id="timerChips"></div></div>

      <p class="summary" id="summary"></p>

      <div class="setup-actions">
        <button id="resumeBtn" class="btn ghost hidden"></button>
        <button id="startBtn" class="btn big primary">Let's play! ▶</button>
      </div>
      <a class="sound-link" href="sounds.html" target="_blank">🔊 Hear all the sounds</a>
    </div>
  </section>

  <!-- ===== Game ===== -->
  <section id="game" class="screen">
    <header class="topbar">
      <div class="team-panel t0" data-team="0"></div>
      <div class="center">
        <div class="turn" id="turnLabel"></div>
        <div class="tools">
          <button id="soundBtn" title="Sound on/off">🔊</button>
          <button id="fsBtn" title="Full screen">⛶</button>
          <button id="finishBtn" title="Finish game">🏁</button>
          <button id="menuBtn" title="Back to menu">🏠</button>
        </div>
      </div>
      <div class="team-panel t1" data-team="1"></div>
    </header>
    <main id="board" class="board"></main>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="questions.js"></script>
  <script src="sounds.js"></script>
  <script src="game.js"></script>
</body>
</html>
